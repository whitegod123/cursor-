[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espcp-metering"
version = "0.1.0"
description = "电潜螺杆泵（ESPCP）产液量数字计产模型：几何排量 + 漏失标定 + 黏温修正 + 扭矩功率校核"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["espcp_metering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
